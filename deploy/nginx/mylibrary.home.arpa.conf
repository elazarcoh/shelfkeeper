# My Library behind the Pi's shared nginx container (Ruling R30: matches the existing pattern in
# /Media/komodo/stacks/nginx/conf.d, one server file per app, proxied by container name over the
# external `shared` Docker network — see e.g. sonarr.home.arpa.conf). Install this file into that
# nginx's conf.d and reload it (README → Running on a server). Plain http (COOKIE_SECURE=false).
#
# The `set $upstream ...; proxy_pass http://$upstream;` indirection (instead of a bare proxy_pass)
# makes nginx resolve the container name at request time via Docker's embedded DNS, so it doesn't
# fail to start — or proxy to a stale IP — across an app container restart. That resolution comes
# from conf.d/00-common.conf's `resolver 127.0.0.11 valid=30s ipv6=off;`; this file must not redefine it.
server {
    listen 80;
    server_name mylibrary.home.arpa;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        set $upstream my-library:3000;
        proxy_pass http://$upstream;
    }

    # a 2000-row CSV import can outlast nginx's default 60 s (spec §3); tRPC batching can put it anywhere in the path
    location ~ ^/trpc/.*csv\.import {
        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        set $upstream my-library:3000;
        proxy_pass http://$upstream;
    }

    # restoring a backup (pg_restore + merging covers) can take minutes on the Pi
    location ~ ^/trpc/.*backups\.restore {
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        set $upstream my-library:3000;
        proxy_pass http://$upstream;
    }

    # restore from an uploaded backup: stream it through, and wait while the app checks it
    location = /admin/backups/upload {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        set $upstream my-library:3000;
        proxy_pass http://$upstream;
    }

    # backup downloads: stream them, never buffer to the SD card
    location ^~ /admin/backups/file/ {
        proxy_buffering off;
        proxy_read_timeout 600s;
        set $upstream my-library:3000;
        proxy_pass http://$upstream;
    }
}
