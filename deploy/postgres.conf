# My Library on a Raspberry Pi 4 (spec §3). This file replaces the image's postgresql.conf (config_file=…),
# so it also carries the settings the image would otherwise set.
listen_addresses = '*'
# Connection budget (worst case, during a restore): app pool 5 + pg-boss sender 2, worker pool 3 +
# pg-boss 4, and the backup/restore/migration clients, one connection each (a few at a time). Well under 50.
max_connections = 50

# durability: never turned off
fsync = on
synchronous_commit = on
full_page_writes = on

# memory: a small household library on an 8 GB Pi shared with other apps
shared_buffers = 128MB
work_mem = 8MB
maintenance_work_mem = 64MB

# fewer, larger checkpoints: less writing to the HDD
checkpoint_timeout = 15min
max_wal_size = 512MB
min_wal_size = 80MB
wal_compression = on

# minimal logging: slow statements only
log_min_duration_statement = 1000
log_checkpoints = off
log_connections = off
log_disconnections = off

dynamic_shared_memory_type = posix
datestyle = 'iso, mdy'
timezone = 'UTC'
default_text_search_config = 'pg_catalog.english'
